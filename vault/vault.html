<title>재혁 Vault</title>
<style>
:root{
  --canvas:#ffffff; --bg:#ffffff; --side:#f5f5f7; --ink:#1d1d1f; --ink-2:#6e6e73;
  --hair:rgba(29,29,31,.10); --hair-2:rgba(29,29,31,.05); --edge:rgba(29,29,31,.16);
  --fill:#0071e3; --link:#0066cc; --on-fill:#ffffff;
  --g-subject:#2f6fe0; --g-activity:#12a07a; --g-reading:#d98a1c; --g-award:#e0584b; --g-career:#8b5cf6; --g-admission:#d6457f; --g-daily:#0e9bb0; --g-etc:#8a919e;
  --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --text:"SF Pro Text",-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --lw:264px; --rw:320px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0b0b0c; --bg:#141415; --side:#1d1d1f; --ink:#f5f5f7; --ink-2:rgba(245,245,247,.58);
    --hair:rgba(245,245,247,.10); --hair-2:rgba(245,245,247,.05); --edge:rgba(245,245,247,.14);
    --link:#2997ff;
    --g-subject:#6aa1ff; --g-activity:#4fd1a5; --g-reading:#f4b35e; --g-award:#ff8a7a; --g-career:#b79cff; --g-admission:#ff86b4; --g-daily:#5fd0e0; --g-etc:#a3abb8;
  }
}
:root[data-theme="dark"]{
  --canvas:#0b0b0c; --bg:#141415; --side:#1d1d1f; --ink:#f5f5f7; --ink-2:rgba(245,245,247,.58);
  --hair:rgba(245,245,247,.10); --hair-2:rgba(245,245,247,.05); --edge:rgba(245,245,247,.14);
  --link:#2997ff;
  --g-subject:#6aa1ff; --g-activity:#4fd1a5; --g-reading:#f4b35e; --g-award:#ff8a7a; --g-career:#b79cff; --g-admission:#ff86b4; --g-daily:#5fd0e0; --g-etc:#a3abb8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--text);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fill);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.ring{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}

/* layout */
.app{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);height:100%;transition:grid-template-columns .25s ease}
.app.no-left{grid-template-columns:0 minmax(0,1fr) var(--rw)}
.app.no-right{grid-template-columns:var(--lw) minmax(0,1fr) 0}
.app.no-left.no-right{grid-template-columns:0 minmax(0,1fr) 0}
.left,.right{background:var(--side);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.left{border-right:1px solid var(--hair)}
.right{border-left:1px solid var(--hair)}
.no-left .left{border-right:0} .no-right .right{border-left:0}
.center{display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:980px;white-space:nowrap;font:400 17px/1 var(--text);height:44px;padding:11px 21px;border:1px solid transparent}
.btn.sm{font-size:14px;height:36px;padding:8px 15px}
.btn.xs{font-size:12px;height:28px;padding:5px 12px}
.btn.fill{background:var(--fill);color:var(--on-fill)} .btn.fill:hover{filter:brightness(1.08)}
.btn.line{background:transparent;color:var(--link);border-color:var(--link)} .btn.line:hover{background:var(--hair-2)}
.btn.plain{background:transparent;color:var(--ink);border-color:var(--hair)} .btn.plain:hover{background:var(--hair-2)}
.btn[disabled]{opacity:.4;cursor:default}
.icon{width:32px;height:32px;border-radius:980px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink-2);font-size:16px;flex:none}
.icon:hover{background:var(--hair-2);color:var(--ink)}
.link{border:0;background:none;padding:0;color:var(--link);font:inherit;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}

/* left */
.l-head{padding:16px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--g-subject),var(--g-career),var(--g-admission),var(--g-award),var(--g-reading),var(--g-activity),var(--g-subject));opacity:.9}
.brand h1{font:600 17px/1 var(--display);margin:0;flex:1}
.l-sub{font-size:12px;color:var(--ink-2);margin:6px 0 12px}
.quick{width:100%;justify-content:space-between;background:var(--bg);border-color:var(--hair);color:var(--ink-2)}
.quick kbd{font:400 12px var(--text)}
.seg{display:flex;background:var(--hair-2);border-radius:980px;padding:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:980px;height:28px;font-size:12px;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.l-head .seg{margin-top:10px}
.l-body{flex:1;overflow:auto;padding:4px 8px 16px}
.folder > button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--ink-2)}
.folder > button:hover{background:var(--hair-2)}
.folder > button .chev{width:10px;transition:transform .15s;display:inline-block}
.folder.closed > button .chev{transform:rotate(-90deg)}
.folder.closed > .files{display:none}
.folder > button .n{margin-left:auto}
.file{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:8px;padding:5px 8px 5px 26px;text-align:left;font-size:14px;color:var(--ink)}
.file:hover{background:var(--hair-2)}
.file.on{background:var(--bg)}
.file .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .m{font-size:12px;color:var(--ink-2)}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px}
.tagcloud button{border:0;background:var(--hair-2);border-radius:980px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.tagcloud button:hover,.tagcloud button.on{color:var(--link)}
.sub-h{font-size:12px;color:var(--ink-2);margin:16px 8px 6px;display:flex;justify-content:space-between}
.filter{width:100%;height:32px;border-radius:980px;border:1px solid var(--hair);background:var(--bg);padding:0 14px;margin:6px 0 4px;font-size:14px}
.filter::placeholder{color:var(--ink-2)}
.empty{font-size:12px;color:var(--ink-2);padding:6px 8px;margin:0}
.task{display:flex;gap:9px;align-items:flex-start;padding:5px 8px;border-radius:8px;font-size:14px}
.task:hover{background:var(--hair-2)}
.task input{margin:3px 0 0;accent-color:var(--fill);width:15px;height:15px;flex:none}
.task span{flex:1}
.lint{margin:10px 0 14px}
.lint h2{font:400 14px var(--text);margin:0 8px 2px;display:flex;justify-content:space-between}
.lint h2 span{color:var(--ink-2);font-size:12px}
.lint p.d{font-size:12px;color:var(--ink-2);margin:0 8px 6px}
.lint .row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:14px}
.lint .row:hover{background:var(--hair-2)}
.lint .row .t{flex:1;min-width:0}
.lint .row small{display:block;font-size:12px;color:var(--ink-2)}
.log{list-style:none;margin:6px 0;padding:0}
.log li{padding:8px;border-bottom:1px solid var(--hair-2);font-size:14px}
.log .when,.log .op{font-size:12px;color:var(--ink-2)} .log .op{margin-right:6px}

/* tabs */
.tabs{display:flex;align-items:center;gap:2px;height:48px;padding:0 8px;border-bottom:1px solid var(--hair);background:var(--bg);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:34px;max-width:200px;border:0;background:transparent;border-radius:10px;padding:0 6px 0 12px;font-size:14px;color:var(--ink-2);flex:none}
.tab:hover{background:var(--hair-2)}
.tab.on{background:var(--side);color:var(--ink)}
.tab .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:14px;color:var(--ink-2);opacity:0}
.tab:hover .x,.tab.on .x{opacity:1}
.tab .x:hover{background:var(--hair)}
.tab.graph{padding-right:12px}
.tabs .spacer{flex:1;min-width:8px}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0}

/* graph */
.graph-view{background:var(--canvas)}
#graph{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#graph.drag{cursor:grabbing} #graph.on-node{cursor:pointer}
.g-tools{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:3}
.g-tools .icon,.g-zoom .icon{background:var(--bg);border:1px solid var(--hair);width:36px;height:36px}
.g-zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:3}
.g-legend{position:absolute;left:14px;bottom:14px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 180px);z-index:3}
.g-legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--bg);border-radius:980px;padding:4px 10px;font-size:12px;color:var(--ink)}
.g-legend button[aria-pressed="false"]{opacity:.45}
.g-hint{position:absolute;left:14px;top:14px;font-size:12px;color:var(--ink-2);z-index:3;pointer-events:none}
.pop{position:absolute;top:58px;right:14px;width:250px;background:var(--bg);border:1px solid var(--hair);border-radius:18px;padding:14px 16px;z-index:4}
.pop h3{font:400 12px var(--text);color:var(--ink-2);margin:0 0 6px}
.pop label{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:5px 0}
.pop input[type=checkbox]{accent-color:var(--fill);width:16px;height:16px}
.pop input[type=range]{width:100%;accent-color:var(--fill)}
.preview{position:absolute;width:260px;background:var(--bg);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;pointer-events:none;z-index:5;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.preview.show{opacity:1;transform:none}
.preview .pt{font:600 14px/1.3 var(--text);margin:0 0 2px;display:flex;gap:7px;align-items:center}
.preview .pm{font-size:12px;color:var(--ink-2);margin:0 0 6px}
.preview .pb{font-size:12px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0;line-height:1.55}
.stage-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-2);pointer-events:none;z-index:2}
.stage-empty strong{display:block;font:400 28px/1.2 var(--display);color:var(--ink);margin-bottom:6px}

/* doc */
.note-view{overflow:auto;background:var(--bg)}
.doc{max-width:760px;margin:0 auto;padding:40px 48px 96px}
.crumb{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.d-title{width:100%;border:0;background:transparent;font:600 40px/1.15 var(--display);letter-spacing:-.015em;padding:0;margin:0 0 14px;resize:none;overflow:hidden}
.d-title:focus{outline:none}
.props{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:980px;background:var(--side);padding:0 4px 0 11px;font-size:12px;color:var(--ink-2)}
.pchip select{border:0;background:transparent;font-size:12px;color:var(--ink);padding:0 8px 0 0;appearance:none;-webkit-appearance:none;cursor:pointer}
.pchip select:disabled{cursor:default}
.pchip.static{padding-right:11px}
.d-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.d-bar .spacer{flex:1}
.d-bar .state{font-size:12px;color:var(--ink-2)}
.md{font:400 17px/1.7 var(--text)}
.md h1,.md h2,.md h3{font-family:var(--display);letter-spacing:-.01em;margin:30px 0 8px;line-height:1.25}
.md h1{font-weight:400;font-size:28px} .md h2{font-weight:600;font-size:21px} .md h3{font-weight:600;font-size:17px}
.md > :first-child{margin-top:0}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px;padding-left:24px}
.md li{margin:3px 0}
.md li::marker{color:var(--ink-2)}
.md li.task-li{list-style:none;margin-left:-24px;display:flex;gap:10px;align-items:flex-start}
.md li.task-li input{margin:7px 0 0;accent-color:var(--fill);width:16px;height:16px;flex:none}
.md li.task-li.done > span{color:var(--ink-2);text-decoration:line-through}
.md blockquote{margin:0 0 14px;padding:4px 0 4px 16px;border-left:3px solid var(--hair);color:var(--ink-2)}
.md .tbl{overflow-x:auto;margin:0 0 14px;border:1px solid var(--hair);border-radius:14px}
.md table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.md th,.md td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--hair-2)}
.md th{background:var(--side);font-weight:600;color:var(--ink-2);font-size:12px}
.md tbody tr:last-child td{border-bottom:0}
.pv .md table{font-size:12px} .pv .md th,.pv .md td{padding:4px 8px}
.danger-link.armed{color:#e0584b}
.md code{font:400 14px var(--mono);background:var(--side);border-radius:6px;padding:1px 6px}
.md pre{background:var(--side);border-radius:14px;padding:14px 16px;overflow:auto;margin:0 0 14px}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--hair);margin:22px 0}
.md a,.md .wl{color:var(--link);text-decoration:none;border:0;background:none;padding:0;font:inherit;cursor:pointer}
.md a:hover,.md .wl:hover{text-decoration:underline}
.md .wl.ghost{color:var(--ink-2);text-decoration:underline dotted}
.md .tag{border:0;background:var(--side);border-radius:980px;padding:1px 9px;font:400 14px var(--text);color:var(--ink-2);cursor:pointer}
.md .tag:hover{color:var(--link)}
.md-empty{color:var(--ink-2)}
.editor{position:relative}
.editor textarea{width:100%;min-height:360px;resize:none;border:0;background:transparent;padding:0;font:400 15px/1.8 var(--mono);color:var(--ink)}
.editor textarea:focus{outline:none}
.suggest{position:absolute;left:0;min-width:280px;list-style:none;margin:4px 0 0;padding:6px;background:var(--bg);border:1px solid var(--hair);border-radius:14px;z-index:3}
.suggest li{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.suggest li.on,.suggest li:hover{background:var(--hair-2)}
.hint{font-size:12px;color:var(--ink-2);margin:10px 0 0}
.hint code{font:400 12px var(--mono);background:var(--side);border-radius:5px;padding:1px 5px}
.refs{margin-top:48px;padding-top:20px;border-top:1px solid var(--hair)}
.refs h2{font:600 14px var(--text);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.refs h2 span{font-weight:400;font-size:12px;color:var(--ink-2)}
.ref{padding:10px 0;border-bottom:1px solid var(--hair-2)}
.ref .rt{display:flex;align-items:center;gap:8px;font-size:14px}
.ref .rs{font-size:14px;color:var(--ink-2);margin:4px 0 0 16px;line-height:1.55}
.ref .rs mark{background:transparent;color:var(--ink);font-weight:600}
.ref .rt .spacer{flex:1}
.danger-link{border:0;background:none;color:var(--ink-2);font-size:12px;padding:0;margin-top:36px}
.danger-link:hover{color:var(--ink);text-decoration:underline}

/* right */
.r-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;height:48px;border-bottom:1px solid var(--hair);flex:none}
.r-head .seg{flex:1}
.r-body{flex:1;overflow:auto;padding:14px 16px 24px}
.r-sec{margin-bottom:22px}
.r-sec h3{font:400 12px var(--text);color:var(--ink-2);margin:0 0 8px;display:flex;justify-content:space-between}
#local{width:100%;height:240px;display:block;border-radius:14px;background:var(--canvas);cursor:pointer}
.outline a{display:block;font-size:14px;color:var(--ink);text-decoration:none;padding:3px 0;cursor:pointer}
.outline a:hover{color:var(--link)}
.outline a.h3{padding-left:14px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);background:var(--bg);border-radius:980px;padding:4px 11px 4px 9px;font-size:12px;color:var(--ink);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.pv-title{font:600 21px/1.25 var(--display);margin:4px 0 4px}
.pv-meta{font-size:12px;color:var(--ink-2);margin:0 0 12px}
.pv .md{font-size:14px;line-height:1.65;max-height:340px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.pv .md h1{font-size:17px} .pv .md h2{font-size:14px;margin:14px 0 4px} .pv .md h3{font-size:14px}
.pv .md li.task-li input{margin-top:4px}
.r-empty{font-size:14px;color:var(--ink-2)}
.r-empty strong{display:block;font:600 17px var(--display);color:var(--ink);margin-bottom:4px}
.recent button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:8px;padding:6px 6px;font-size:14px;text-align:left;color:var(--ink)}
.recent button:hover{background:var(--hair-2)}
.recent .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .m{font-size:12px;color:var(--ink-2)}
.stat{display:flex;gap:10px;margin-bottom:22px}
.stat div{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:600 21px var(--display)}
.stat span{font-size:12px;color:var(--ink-2)}

/* claude */
.c-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.c-log{display:flex;flex-direction:column;gap:14px}
.msg{white-space:pre-wrap;word-break:break-word;font:400 14px/1.65 var(--text)}
.msg.me{align-self:flex-end;max-width:90%;background:var(--bg);border-radius:14px;padding:8px 12px}
.msg.me .lbl{display:block;font-size:12px;color:var(--ink-2)}
.msg.bot .status{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.msg.bot .err{display:block;font-size:12px;color:var(--ink-2);margin-top:8px}
.msg.bot .acts{display:flex;gap:8px;margin-top:10px;white-space:normal}
.msg .wl{border:0;background:none;padding:0;font:inherit;color:var(--link);cursor:pointer}
.msg .wl:hover{text-decoration:underline}
.c-intro{font-size:14px;color:var(--ink-2)}
.c-intro p{margin:0 0 10px}
.c-intro .btn{margin:0 6px 6px 0;white-space:normal;height:auto;min-height:36px;text-align:left}
.composer{border-top:1px solid var(--hair);padding:10px 12px 12px;flex:none}
.composer textarea,.composer input,.composer select{width:100%;border:1px solid var(--hair);background:var(--bg);border-radius:14px;padding:9px 12px;resize:none;font-size:14px}
.composer textarea:focus,.composer input:focus{outline:none;border-color:var(--fill)}
.composer .row{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.composer .row > :first-child{flex:1}
.composer .note{font-size:12px;color:var(--ink-2)}
.c-modes{margin-bottom:14px}

/* palette */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding-top:14vh}
.palette{width:min(580px,calc(100% - 32px));background:var(--bg);border:1px solid var(--hair);border-radius:18px;overflow:hidden}
.palette input{width:100%;height:56px;border:0;border-bottom:1px solid var(--hair);background:transparent;padding:0 20px;font:400 17px var(--text)}
.palette input:focus{outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.palette li.on{background:var(--hair-2)}

<script>
(() => {
"use strict";

// ============ constants ============
const GROUPS = [
  {id:"subject",   label:"교과"},
  {id:"activity",  label:"창체"},
  {id:"reading",   label:"독서"},
  {id:"award",     label:"수상"},
  {id:"career",    label:"진로"},
  {id:"admission", label:"대입"},
  {id:"daily",     label:"일상"},
  {id:"etc",       label:"기타"},
];
const FOLDER_TO_GROUP = Object.fromEntries(GROUPS.map(g => [g.label, g.id]));
const GIDS = GROUPS.map(g => g.id);
const STATUSES = ["진행중", "예정", "확인 필요", "완료", "보관"];
const LS_NOTES = "jh-vault-notes-v1", LS_LOG = "jh-vault-log-v1";
const DAY = 86400000;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ============ state ============
const notes = new Map();
let logEntries = [];
let nodes = [], links = [], nodeById = new Map();
const hiddenGroups = new Set();
const opt = {sources:true, orphans:true, labels:false, spacing:1, cluster:.55};
let selectedId = null, hoverId = null;
let tabs = ["graph"], active = "graph";
let editing = false;
let mode = "loading", readOnly = false, db = null;
let leftTab = "files", rightTab = "info", fileFilter = "", tagFilter = "";
const collapsed = new Set();
const editedAt = {}, saveTimers = {}, saveChains = {}, lastEditLog = {};
let pending = 0;

// ============ utils ============
const $ = id => document.getElementById(id);
const norm = s => (s || "").trim().toLowerCase();
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const H = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const gOf = n => n && GIDS.includes(n.group) ? n.group : "etc";
const gLabel = id => (GROUPS.find(g => g.id === id) || GROUPS[GROUPS.length - 1]).label;
const isSource = n => !!n && n.type === "source";
const LINK_RE = /\[\[([^\]|#\n]+)(?:[|#][^\]\n]*)?\]\]/g;
function parseLinks(body){ const out = []; let m; LINK_RE.lastIndex = 0; while ((m = LINK_RE.exec(body || ""))) { const t = m[1].trim(); if (t) out.push(t); } return out; }
function parseTags(body){ const s = new Set(); const re = /(^|[\s(])#([0-9A-Za-z가-힣_\-/]+)/g; let m; const b = (body || "").replace(/^#{1,6}\s.*$/gm, ""); while ((m = re.exec(b))) s.add(m[2]); return [...s]; }
function parseTasks(body){ const out = []; (body || "").split("\n").forEach((ln, i) => { const m = ln.match(/^\s*[-*]\s\[( |x|X)\]\s+(.*)$/); if (m) out.push({line:i, done:m[1] !== " ", text:m[2]}); }); return out; }
function plain(body){ return (body || "").replace(/\[\[([^\]|#\n]+)(?:[|#][^\]\n]*)?\]\]/g, "$1").replace(/[#*>`]/g, "").replace(/^\s*[-*]\s\[[ xX]\]\s*/gm, "").replace(/\s+/g, " ").trim(); }
function titleIdx(){ const m = new Map(); notes.forEach(n => m.set(norm(n.title), n.id)); return m; }
function byTitle(t){ const id = titleIdx().get(norm(t)); return id ? notes.get(id) : null; }
function rel(ts){
  if (!ts) return ""; const d = Date.now() - ts;
  if (d < 60000) return "방금"; if (d < 3600000) return Math.floor(d / 60000) + "분 전";
  if (d < DAY) return Math.floor(d / 3600000) + "시간 전"; if (d < 30 * DAY) return Math.floor(d / DAY) + "일 전";
  const t = new Date(ts); return `${t.getFullYear()}.${t.getMonth() + 1}.${t.getDate()}`;
}
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }
function dotFor(n){ const g = gOf(n); return `<span class="dot${isSource(n) ? " ring" : ""}" style="background:var(--g-${g});color:var(--g-${g})"></span>`; }
const ghostDot = `<span class="dot ring" style="color:var(--ink-2)"></span>`;
const mobile = () => innerWidth <= 900;

// ============ theme ============
let C = {};
function readTheme(){
  const s = getComputedStyle(document.documentElement), v = k => s.getPropertyValue(k).trim();
  C = {canvas:v("--canvas"), bg:v("--bg"), ink:v("--ink"), ink2:v("--ink-2"), edge:v("--edge"), fill:v("--fill"), link:v("--link")};
  GIDS.forEach(g => C[g] = v("--g-" + g));
  C.font = getComputedStyle(document.body).fontFamily;
}
readTheme();
const onTheme = () => { readTheme(); drawLocal(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
new MutationObserver(onTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
function rgba(hex, a){
  const m = hex.replace("#", ""); if (m.length !== 6) return hex;
  return `rgba(${parseInt(m.slice(0, 2), 16)},${parseInt(m.slice(2, 4), 16)},${parseInt(m.slice(4, 6), 16)},${a})`;
}

// ============ graph model ============
// deterministic layout seed, so the map looks the same every time you open it
function hrand(s, k){ let x = 2166136261 ^ k; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } x ^= x >>> 13; x = Math.imul(x, 0x5bd1e995); x ^= x >>> 15; return (x >>> 0) / 4294967296; }
function rebuild(){
  const idx = titleIdx(), prev = nodeById, next = new Map(), keys = new Set(), L = [], ghosts = new Map();
  notes.forEach(n => {
    if (hiddenGroups.has(gOf(n)) || (!opt.sources && isSource(n))) return;
    next.set(n.id, {id:n.id, title:n.title || "제목 없음", group:gOf(n), source:isSource(n), ghost:false});
  });
  notes.forEach(n => {
    if (!next.has(n.id)) return;
    parseLinks(n.body).forEach(t => {
      let tid = idx.get(norm(t));
      if (!tid) { tid = "ghost:" + norm(t); if (!ghosts.has(tid)) ghosts.set(tid, {id:tid, title:t, group:"etc", ghost:true}); }
      else if (!next.has(tid)) return;
      if (tid === n.id) return;
      const k = n.id < tid ? n.id + "|" + tid : tid + "|" + n.id;
      if (keys.has(k)) return; keys.add(k); L.push({s:n.id, t:tid});
    });
  });
  ghosts.forEach((g, id) => next.set(id, g));
  next.forEach(nd => { const p = prev.get(nd.id); if (p) { nd.x = p.x; nd.y = p.y; nd.vx = p.vx; nd.vy = p.vy; nd.a = p.a; nd.la = p.la; nd.rr = p.rr; } nd.deg = 0; });
  L.forEach(l => { next.get(l.s).deg++; next.get(l.t).deg++; });
  if (!opt.orphans) [...next.keys()].forEach(id => { if (next.get(id).deg === 0) next.delete(id); });
  [...next.values()].sort((p, q) => p.id < q.id ? -1 : 1).forEach(nd => {
    if (nd.x !== undefined) return;
    const l = L.find(l => (l.s === nd.id && next.get(l.t)?.x !== undefined) || (l.t === nd.id && next.get(l.s)?.x !== undefined));
    const an = l ? next.get(l.s === nd.id ? l.t : l.s) : null;
    const gi = GIDS.indexOf(nd.group), ga = gi / GIDS.length * Math.PI * 2;
    const a = hrand(nd.id, 1) * Math.PI * 2, d = an ? 30 : 40 + hrand(nd.id, 2) * 60;
    nd.x = (an ? an.x : Math.cos(ga) * 180) + Math.cos(a) * d; nd.y = (an ? an.y : Math.sin(ga) * 180) + Math.sin(a) * d;
    nd.vx = nd.vy = 0; nd.a = 0; nd.la = 0;
  });
  next.forEach(nd => { nd.r = nd.ghost ? 2.8 : 3.8 + Math.sqrt(nd.deg) * 2.7; if (nd.rr === undefined) nd.rr = nd.r; });
  nodeById = next; nodes = [...next.values()];
  links = L.filter(l => next.has(l.s) && next.has(l.t)).map(l => ({...l, sn:next.get(l.s), tn:next.get(l.t)}));
  alpha = Math.max(alpha, .3);
  updateStats();
}
function updateStats(){
  let pages = 0, srcs = 0; notes.forEach(n => isSource(n) ? srcs++ : pages++);
  const open = [...notes.values()].reduce((a, n) => a + parseTasks(n.body).filter(t => !t.done).length, 0);
  $("stats").textContent = `노트 ${pages} · 소스 ${srcs} · 할 일 ${open}` + (mode === "local" ? " · 이 기기에만 저장" : readOnly ? " · 보기 전용" : "");
  const se = $("stageEmpty");
  if (mode === "loading") { se.hidden = false; return; }
  if (notes.size) { se.hidden = true; return; }
  se.hidden = false;
  se.innerHTML = readOnly ? "<div><strong>아직 비어 있어요</strong>편집 권한이 있는 사람이 노트를 추가하면 보여요.</div>" : "<div><strong>아직 비어 있어요</strong>N을 눌러 첫 노트를 만들어 보세요.</div>";
}

// ============ simulation ============
let alpha = 1, alphaTarget = 0;
function tick(){
  if (alpha < .002 && alphaTarget === 0) return;
  alpha += (alphaTarget - alpha) * .02;
  const n = nodes.length, sp = opt.spacing;
  for (let i = 0; i < n; i++) { const a = nodes[i];
    for (let j = i + 1; j < n; j++) { const b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = hrand(a.id + b.id, 3) - .5; dy = hrand(a.id + b.id, 4) - .5; d2 = 1; }
      if (d2 > 360000 * sp) continue;
      const f = -300 * sp * alpha / d2;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
  }
  for (const l of links) { const a = l.sn, b = l.tn;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const same = a.group === b.group;
    const target = (same ? 44 : 70) * sp + (a.r + b.r) * 2;
    // degree-weighted springs: a hub with many links moves less than its leaves, so hubs don't overshoot
    const k = (d - target) / d * alpha * .5 / Math.max(1, Math.min(a.deg, b.deg));
    const bias = a.deg / Math.max(1, a.deg + b.deg);
    a.vx += dx * k * (1 - bias); a.vy += dy * k * (1 - bias); b.vx -= dx * k * bias; b.vy -= dy * k * bias;
  }
  if (opt.cluster > 0) {
    const cen = {};
    for (const a of nodes) { if (a.ghost) continue; const c = cen[a.group] || (cen[a.group] = {x:0, y:0, n:0}); c.x += a.x; c.y += a.y; c.n++; }
    const s = opt.cluster * .035 * alpha;
    for (const a of nodes) { const c = cen[a.group]; if (!c || a.ghost) continue; a.vx += (c.x / c.n - a.x) * s; a.vy += (c.y / c.n - a.y) * s; }
  }
  for (const a of nodes) {
    a.vx -= a.x * .01 * alpha; a.vy -= a.y * .01 * alpha;
    if (a === dragNode) { a.vx = a.vy = 0; continue; }
    a.vx *= .6; a.vy *= .6; a.x += a.vx; a.y += a.vy;
  }
}

// ============ canvas & camera ============
const gv = $("graphView"), cv = $("graph"), ctx = cv.getContext("2d");
let W = 0, Hh = 0, dpr = 1;
const cam = {x:0, y:0, k:1}, camT = {x:0, y:0, k:1};
function resize(){ const r = gv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2); W = r.width; Hh = r.height; cv.width = Math.max(1, W * dpr); cv.height = Math.max(1, Hh * dpr); }
new ResizeObserver(resize).observe(gv); resize();
const toWorld = (sx, sy) => ({x:(sx - W / 2 - cam.x) / cam.k, y:(sy - Hh / 2 - cam.y) / cam.k});
const toScreen = (x, y) => ({x:W / 2 + cam.x + x * cam.k, y:Hh / 2 + cam.y + y * cam.k});
function fit(anim = true){
  if (!nodes.length || !W) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x); y1 = Math.max(y1, n.y); });
  const k = clamp(Math.min((W - 140) / Math.max(1, x1 - x0), (Hh - 160) / Math.max(1, y1 - y0)), .25, 1.8);
  camT.k = k; camT.x = -((x0 + x1) / 2) * k; camT.y = -((y0 + y1) / 2) * k;
  if (!anim) Object.assign(cam, camT);
}
function centerOn(n, k){ camT.k = k || Math.max(cam.k, 1.2); camT.x = -n.x * camT.k; camT.y = -n.y * camT.k; }
function zoomAt(f, sx, sy){ const w = toWorld(sx, sy), k = clamp(camT.k * f, .2, 5); camT.k = k; camT.x = sx - W / 2 - w.x * k; camT.y = sy - Hh / 2 - w.y * k; }
function neighbours(id){ const s = new Set([id]); links.forEach(l => { if (l.s === id) s.add(l.t); else if (l.t === id) s.add(l.s); }); return s; }

function draw(now){
  requestAnimationFrame(draw);
  if (active !== "graph" || !W) return;
  tick();
  cam.x += (camT.x - cam.x) * .16; cam.y += (camT.y - cam.y) * .16; cam.k += (camT.k - cam.k) * .16;
  const focus = hoverId || selectedId;
  const nb = focus && nodeById.has(focus) ? neighbours(focus) : null;
  let tagSet = null;
  if (tagFilter) { tagSet = new Set(); notes.forEach(n => { if (parseTags(n.body).some(t => norm(t) === norm(tagFilter))) tagSet.add(n.id); }); }
  for (const n of nodes) {
    let t = 1;
    if (tagSet) t = tagSet.has(n.id) ? 1 : .1; else if (nb) t = nb.has(n.id) ? 1 : .1;
    n.a += (t - n.a) * .14;
    const tr = n.r * (n.id === focus ? 1.45 : 1);
    n.rr += (tr - n.rr) * .2;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.canvas; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * cam.k, 0, 0, dpr * cam.k, dpr * (W / 2 + cam.x), dpr * (Hh / 2 + cam.y));
  ctx.lineCap = "round";
  const fNode = focus ? nodeById.get(focus) : null, fCol = fNode ? (fNode.ghost ? C.ink2 : C[fNode.group]) : C.link;
  // edges
  for (const l of links) {
    const hi = nb && (l.s === focus || l.t === focus);
    const a = hi ? .9 : Math.max(.05, Math.min(l.sn.a, l.tn.a) * (nb ? .5 : 1));
    ctx.globalAlpha = a; ctx.strokeStyle = hi ? fCol : C.edge; ctx.lineWidth = (hi ? 1.6 : 1) / cam.k;
    ctx.beginPath(); ctx.moveTo(l.sn.x, l.sn.y); ctx.lineTo(l.tn.x, l.tn.y); ctx.stroke();
  }
  // pulses along focused edges
  if (nb && fNode && !reduceMotion) {
    const t0 = (now || 0) / 1400; ctx.fillStyle = fCol;
    links.forEach((l, i) => {
      if (l.s !== focus && l.t !== focus) return;
      const other = l.s === focus ? l.tn : l.sn, p = (t0 + i * .137) % 1;
      const x = fNode.x + (other.x - fNode.x) * p, y = fNode.y + (other.y - fNode.y) * p;
      ctx.globalAlpha = Math.sin(p * Math.PI) * .9;
      ctx.beginPath(); ctx.arc(x, y, 1.8 / Math.sqrt(cam.k) + .4, 0, Math.PI * 2); ctx.fill();
    });

위키 구조 (LLM Wiki 방식)
- 소스: 인터뷰 원문, 조사 자료 같은 원본. 읽기만 하고 절대 고치지 마.
- 위키 노트: 네가 정리하고 연결하는 노트. 사람은 소스를 고르고 방향을 정하고, 너는 요약, 연결, 정리, 점검을 맡아.
- 노트끼리는 [[노트 제목]]으로 연결. 태그는 #태그, 할 일은 "- [ ] 내용".
- 상태: 진행중, 예정, 확인 필요, 완료, 보관.

규칙
- 새 노트를 만들기 전에 비슷한 노트가 있는지 먼저 찾아서, 있으면 그 노트를 고쳐. 중복 금지.
- 위키에 사실을 적을 땐 근거 소스를 [[소스 제목]]으로 달아.
- 노트나 소스에 없는 사실은 지어내지 마. 확실하지 않으면 '확인 필요'.
- 재혁이 부탁하지 않은 수정은 하지 마. 질문에는 답만 해.
- 노트 본문은 짧은 ## 제목, - 목록, 할 일 위주로.

말투
- 친근한 존댓말. 긴 글로 풀지 말고 한눈에 보이게 짧게, 표와 목록 위주로.
- 노트를 언급할 땐 꼭 [[노트 제목]] 형식.
- 답 마지막 줄은 "점검:"으로 시작해서, 추측이나 확인 안 된 내용이 있었는지 스스로 밝혀.
${toolsOK ? "- 도구로 노트를 고쳤으면 뭘 바꿨는지 한두 줄로 알려줘." : "- 지금은 노트를 직접 못 고쳐. 필요하면 어떻게 고칠지 제안만 해."}${readOnly ? "\n- 이 보기는 읽기 전용이라 수정 불가." : ""}

${full ? "위키 전체 내용" : "위키 목록 (index)"}
${indexText(full)}${cur ? `\n\n지금 보고 있는 노트: ${cur.title}\n---\n${(cur.body || "").slice(0, 4000)}\n---` : ""}`;
}
function afterToolWrite(id, op){ touch(id); rebuild(); renderLegend(); queueSave(id, 0); refreshAll(); renderTabs(); const n = notes.get(id); if (n) addLog(op, n.title, "Claude"); const a = document.activeElement; if (active === id && !(a && (a.id === "dTitle" || a.id === "dText"))) renderDoc(); renderRight(); }
const TOOLS = [
  {name:"search_notes", description:"제목이나 본문에 검색어가 들어간 노트를 최대 10개 찾아. 제목, 종류, 분류, 상태, 본문 앞부분을 돌려줘.",
   inputSchema:{type:"object", properties:{query:{type:"string"}}, required:["query"]},
   execute({query}){ const q = norm(String(query || "")); setStatus(`찾는 중: ${query}`); return [...notes.values()].filter(n => norm(n.title).includes(q) || norm(n.body).includes(q)).slice(0, 10).map(n => ({title:n.title, type:n.type || "page", group:gOf(n), status:n.status || "진행중", snippet:(n.body || "").slice(0, 240)})); }},
  {name:"read_note", description:"제목으로 노트 하나의 전체 본문, 종류, 분류, 상태, 연결을 읽어.",
   inputSchema:{type:"object", properties:{title:{type:"string"}}, required:["title"]},
   execute({title}){ const n = byTitle(String(title || "")); if (!n) throw new Error("그런 제목의 노트가 없어"); setStatus(`읽는 중: ${n.title}`); return {title:n.title, type:n.type || "page", group:gOf(n), status:n.status || "진행중", body:n.body || "", links_out:parseLinks(n.body), links_in:[...notes.values()].filter(o => o.id !== n.id && parseLinks(o.body).some(t => norm(t) === norm(n.title))).map(o => o.title)}; }},
  {name:"create_note", description:"새 위키 노트를 만들어. 같은 제목이 있으면 실패하니 그땐 update_note를 써.",
   inputSchema:{type:"object", properties:{title:{type:"string"}, group:{type:"string", enum:GIDS}, status:{type:"string", enum:STATUSES}, body:{type:"string"}}, required:["title", "body"]},
   execute({title, group, status, body}){
     if (readOnly) throw new Error("읽기 전용이라 못 만들어"); const t = String(title || "").trim(); if (!t) throw new Error("제목이 비었어"); if (byTitle(t)) throw new Error("같은 제목의 노트가 이미 있어");
     const id = newId(), now = Date.now();
     notes.set(id, {id, title:t, type:"page", group:GIDS.includes(String(group)) ? String(group) : "etc", status:STATUSES.includes(String(status)) ? String(status) : "진행중", body:String(body || ""), created:now, updated:now});
     setStatus(`만드는 중: ${t}`); afterToolWrite(id, "생성"); return {created:t}; }},
  {name:"update_note", description:"기존 위키 노트를 고쳐. body는 본문 전체 교체, append는 끝에 덧붙이기, group/status 변경, new_title은 이름 변경(다른 노트 링크도 같이 바뀜). 소스는 고칠 수 없어.",
   inputSchema:{type:"object", properties:{title:{type:"string"}, body:{type:"string"}, append:{type:"string"}, group:{type:"string", enum:GIDS}, status:{type:"string", enum:STATUSES}, new_title:{type:"string"}}, required:["title"]},
   execute({title, body, append, group, status, new_title}){
     if (readOnly) throw new Error("읽기 전용이라 못 고쳐"); const n = byTitle(String(title || "")); if (!n) throw new Error("그런 제목의 노트가 없어"); if (isSource(n)) throw new Error("소스는 원본이라 고칠 수 없어");
     setStatus(`고치는 중: ${n.title}`);
     if (typeof body === "string") n.body = body;
     if (typeof append === "string" && append.trim()) n.body = (n.body ? n.body.replace(/\s+$/, "") + "\n\n" : "") + append;
     if (GIDS.includes(String(group))) n.group = String(group);
     if (STATUSES.includes(String(status))) n.status = String(status);
     if (typeof new_title === "string" && new_title.trim() && norm(new_title) !== norm(n.title)) { if (byTitle(new_title)) throw new Error("바꾸려는 제목이 이미 있어"); const old = n.title; n.title = new_title.trim(); renameRefs(n.id, old, n.title); }
     afterToolWrite(n.id, "수정"); return {updated:n.title}; }},
];
function setStatus(t){ if (statusEl) { statusEl.textContent = t; statusEl.hidden = !t; } }
function cErr(e){
  const c = e && e.code;
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { $("rTabClaude").hidden = true; return "이 보기에서는 Claude를 쓸 수 없어요."; }
  if (c === "tools_unavailable") { toolsOK = false; renderComposer(); return "여기선 노트 수정 도구를 못 써요. 다시 보내면 읽기만 해서 답해요."; }
  if (c === "rate_limited") return "요청이 많아요. 잠깐 뒤에 다시 보내 주세요.";
  if (c === "session_expired") return "로그인이 만료됐어요. 다시 로그인해 주세요.";
  if (c === "prompt_too_large") return "내용이 너무 길어요. 원문을 나눠서 넣어 주세요.";
  if (c === "refused") return "이 요청에는 답하지 않았어요. 방식을 바꿔 물어봐 주세요.";
  if (c === "empty_completion") return "답이 비어 있어요. 더 구체적으로 물어봐 주세요.";
  return "답을 끝까지 받지 못했어요. 다시 해 보세요.";
}
function setBusy(v){ busy = v; const b = $("cSend") || $("iSend") || $("lSend"); if (b) b.textContent = v ? "멈춤" : (b.id === "cSend" ? "보내기" : b.id === "iSend" ? "넣고 정리" : "점검 시작"); }
async function run(userLabel, userText, content, {full = false, useTools = toolsOK, saveable = false, question = ""} = {}){
  if (!sample || busy) return null;
  const log = $("cLog"); log.querySelector(".c-intro")?.remove();
  const u = document.createElement("div"); u.className = "msg me";
  if (userLabel) { const l = document.createElement("span"); l.className = "lbl"; l.textContent = userLabel; u.appendChild(l); }
  u.appendChild(document.createTextNode(userText)); log.appendChild(u);
  const b = document.createElement("div"); b.className = "msg bot";
  statusEl = document.createElement("span"); statusEl.className = "status"; statusEl.textContent = "생각하는 중";
  const body = document.createElement("div"); b.append(statusEl, body); log.appendChild(b);
  $("cBody").scrollTop = $("cBody").scrollHeight;
  turns.push({role:"user", content}); while (turns.length > 14) turns.shift(); if (turns[0]?.role !== "user") turns.shift();
  setBusy(true); ctl = new AbortController();
  const opts = {signal:ctl.signal, onText:({text}) => { setStatus(""); mdMsg(body, text); $("cBody").scrollTop = $("cBody").scrollHeight; }};
  if (useTools) opts.tools = TOOLS; else opts.cache = false;
  let result = null;
  try {
    const res = await sample([{role:"user", content:schema(full)}, ...turns], opts);
    setStatus(""); mdMsg(body, res.text); turns.push({role:"assistant", content:res.text}); result = res.text;
    if (res.truncated) b.insertAdjacentHTML("beforeend", `<span class="err">답이 길어서 중간에 끊겼어요.</span>`);
    if (saveable && !readOnly) {
      const acts = document.createElement("div"); acts.className = "acts";
      const sv = document.createElement("button"); sv.className = "btn xs line"; sv.textContent = "노트로 저장";
      sv.onclick = () => { const t = uniqueTitle("질문: " + question.slice(0, 22).trim()); createNote(t, {group:"etc", status:"완료", body:`> ${question}\n\n${res.text}\n\n#질문`, silent:true, logDetail:"질문 답을 저장"}); sv.disabled = true; sv.textContent = "저장했어요"; toast(`'${t}' 노트로 저장했어요`); };
      acts.appendChild(sv); b.appendChild(acts);
    }
  } catch (e) {
    setStatus("");
    if (e && e.code === "refused") body.textContent = ""; else if (e && e.text) mdMsg(body, e.text);
    if (e && e.code === "cancelled") { if (!body.textContent) body.textContent = "멈췄어요."; }
    else b.insertAdjacentHTML("beforeend", `<span class="err">${H(cErr(e))}</span>`);
  } finally { setBusy(false); ctl = null; statusEl = null; $("cBody").scrollTop = $("cBody").scrollHeight; }
  return result;
}
function ask(q){ openClaude(); if (cMode !== "ask") setMode("ask"); run("", q, q, {saveable:true, question:q}); }
async function ingest(title, raw, group){
  if (readOnly) { toast("보기 전용이라 소스를 넣을 수 없어요"); return; }
  const now = new Date(), t = uniqueTitle(title || `소스 ${now.getMonth() + 1}월 ${now.getDate()}일 ${now.getHours()}시 ${String(now.getMinutes()).padStart(2, "0")}분`);
  createNote(t, {type:"source", group, status:"완료", body:raw, silent:true, logDetail:"소스 추가"});
  $("iTitle").value = ""; $("iBody").value = "";
  const content = `새 소스 [[${t}]]를 위키에 반영해줘.

할 일
1. 소스에서 중요한 사실, 결정, 할 일을 뽑아.
2. 관련 위키 노트를 찾아서 고치고(update_note), 없으면 새로 만들어(create_note). 중복 만들지 마.
3. 고치거나 만든 노트에는 근거로 [[${t}]]를 달아.
4. 기존 노트와 소스가 부딪히면 둘 다 남기고 '확인 필요'로 표시해.
5. 끝나면 바꾼 노트 목록을 [[제목]]으로 짧게 알려줘.

소스 원문
---
${raw.slice(0, 20000)}
---`;
  await run("소스 넣기", t, content, {useTools:toolsOK});
  addLog("소스 반영", t, "Claude가 위키에 반영");
}
async function runLint(){
  if (cMode !== "lint") setMode("lint");
  const L = lintData();
  const content = `위키 전체 점검해줘. 노트는 고치지 말고 보고만 해.

찾을 것
- 노트끼리 서로 모순되는 내용
- 계획이 바뀐 뒤에도 옛날 내용이 남은 노트 (예: 내신 목표, 희망 대학 순위, 선택과목)
- 근거 소스 없이 적힌 사실, 확인이 필요한 사실
- 이어져야 하는데 링크가 빠진 노트

규칙으로 이미 찾은 것 (참고): 없는 노트 링크 ${L.ghosts.length}개, 연결 없는 노트 ${L.orphans.length}개, 인용 안 된 소스 ${L.uncitedSrc.length}개, 확인 필요 ${L.check.length}개.

형식: 항목마다 [[노트]] 이름과 이유 한 줄. 마지막에 먼저 고칠 것 3개.`;
  await run("내용 점검", "위키 전체 점검", content, {full:true, useTools:false});
  addLog("점검", "위키 전체", "Claude 내용 점검");
}

// ============ keyboard ============
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && /^[kKoO]$/.test(e.key)) { e.preventDefault(); openPalette(); return; }
  if (mod && /^[eE]$/.test(e.key) && active !== "graph") { e.preventDefault(); toggleEdit(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if (e.key === "Escape" && !typing) { if (!$("scrim").hidden) closePalette(); else if (!$("displayPop").hidden) $("displayPop").hidden = true; else if (tagFilter) { tagFilter = ""; renderLeft(); } else if (active === "graph") select(null); }
  if (typing || mod) return;
  if (e.key === "/") { e.preventDefault(); openPalette(); }
  else if (/^[nN]$/.test(e.key) && !readOnly) { e.preventDefault(); createNote(); }
  else if (/^[gG]$/.test(e.key)) activate("graph");
  else if (e.key === "0" && active === "graph") fit();
});

// ============ boot ============
function applyIncoming(id, d){
  if (editedAt[id] && Date.now() - editedAt[id] < 3000) return false;
  const ts = v => typeof v === "number" ? v : (Date.parse(v) || 0);
  const group = GIDS.includes(d.group) ? d.group : (FOLDER_TO_GROUP[d.folder] || "etc");
  notes.set(id, {id, title:String(d.title || "제목 없음"), type:d.type === "source" ? "source" : "page", group, status:STATUSES.includes(d.status) ? d.status : "진행중", date:String(d.date || ""), body:String(d.body || ""), created:ts(d.created) || ts(d.updated), updated:ts(d.updated)});
  return true;
}
function startLocal(){
  mode = "local";
  try { JSON.parse(localStorage.getItem(LS_NOTES) || "[]").forEach(n => n && n.id && notes.set(n.id, n)); } catch (e) {}
  try { logEntries = JSON.parse(localStorage.getItem(LS_LOG) || "[]"); } catch (e) { logEntries = []; }
  rebuild(); renderLegend(); renderLeft(); renderRight(); setTimeout(() => fit(), 900); setTimeout(() => { if (!userMoved) fit(); }, 2600);
}
async function boot(){
  renderTabs(); renderLegend(); renderLeft(); renderRight();
  requestAnimationFrame(draw);
  if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
  bootClaude();
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { startLocal(); return; }
  mode = "db";
  try { const user = await window.claude.use("user"); if (user) { const w = await user.can("data.write"); if (w === false) setRO(true); } } catch (e) {}
  let first = true;
  db.collection("notes").onSnapshot(snap => {
    let touchedActive = false;
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id;
      if (ch.type === "removed") { if (!(editedAt[id] && Date.now() - editedAt[id] < 3000)) notes.delete(id); if (id === active) touchedActive = true; }
      else if (applyIncoming(id, ch.doc.data() || {}) && (id === active || id === selectedId)) touchedActive = true;
    });
    rebuild(); renderLegend(); refreshAll(); renderTabs();
    if (touchedActive) { const a = document.activeElement; if (active !== "graph" && !(a && (a.id === "dTitle" || a.id === "dText"))) renderDoc(); renderRight(); }
    else if (first) renderRight();
    if (first) { first = false; setTimeout(() => fit(), 900); setTimeout(() => { if (!userMoved) fit(); }, 2600); }
  }, () => toast("노트를 실시간으로 받지 못하고 있어요. 새로고침해 주세요"));
  db.collection("log").orderBy("at", "desc").limit(150).onSnapshot(snap => { logEntries = snap.docs.map(d => d.data() || {}).filter(e => e.at); if (leftTab === "log") renderLeft(); }, () => {});
}
boot();
})();
